name: Backend CI

on:
  push:
    branches: [ developer, dgpiumal_dev ]
    paths:
      - 'backend-node/**'
  pull_request:
    branches: [ developer, dgpiumal_dev ]
    paths:
      - 'backend-node/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend-node/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
