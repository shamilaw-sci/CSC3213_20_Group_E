name: Thirasara CI Pipeline

on:
  push:
    branches: [ "main", "master", "developer", "version-3.0" ]
  pull_request:
    branches: [ "main", "master", "developer", "version-3.0" ]

permissions:
  contents: read

jobs:
  # ==========================================
  # 1. Go Spatial Map Service CI Job
  # ==========================================
  test-go-service:
    name: Go Map Service Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go from module version
        uses: actions/setup-go@v5
        with:
          go-version-file: go-map-service/go.mod
          cache-dependency-path: go-map-service/go.sum

      - name: Download Go Dependencies
        working-directory: go-map-service
        run: go mod download

      - name: Run Go Vet (Static Analysis)
        working-directory: go-map-service
        run: go vet ./...

      - name: Run Go Unit Tests
        working-directory: go-map-service
        run: go test -v -race -count=1 ./...

      - name: Verify Go Binary Compilation
        working-directory: go-map-service
        run: CGO_ENABLED=0 GOOS=linux go build -v -o /dev/null .

  # ==========================================
  # 2. Node.js Express Backend CI Job
  # ==========================================
  test-node-backend:
    name: Node.js Backend Verification & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend-node/package-lock.json

      - name: Install Node Dependencies
        working-directory: backend-node
        run: npm ci

      - name: Validate Node.js Syntax Across Codebase
        working-directory: backend-node
        shell: bash
        run: |
          node -c server.js
          find routes controllers middleware repositories validators utils -name "*.js" -print0 |
            while IFS= read -r -d '' file; do
              node --check "$file"
            done

      - name: Run Backend Tests
        working-directory: backend-node
        run: npm test -- --runInBand

      - name: Security Scan (npm audit)
        working-directory: backend-node
        run: npm audit --audit-level=high

  # ==========================================
  # 3. React Frontend Tests & Build CI Job (no TypeScript check)
  # ==========================================
  build-frontend:
    name: React Frontend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend-react
        run: npm ci

      - name: Build Production Vite Bundle
        working-directory: frontend-react
        run: npm run build
        env:
          VITE_API_URL: "http://localhost:5000"
          VITE_MAP_API_URL: "http://localhost:8080/api/map/search"

      - name: Run Frontend Tests
        working-directory: frontend-react
        run: npm test -- --maxWorkers=1

      - name: Security Scan (npm audit)
        working-directory: frontend-react
        run: npm audit --audit-level=high

  # ==========================================
  # 4. Docker Compose Multi-Container Build Job
  # ==========================================
  docker-build:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    needs: [test-go-service, test-node-backend, build-frontend]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy Docker Environment Template
        run: cp .env.docker.example .env

      - name: Validate Docker Compose Configurations & Build Images
        run: docker compose build

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
