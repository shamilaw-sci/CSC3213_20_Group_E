# This workflow defines the Continuous Integration process for the frontend application.
# It automatically builds and tests the React app whenever changes are pushed to the main branch.

name: Frontend CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events for the 'developer' branch
  push:
    branches: [ developer ]
    paths:
      - 'frontend-react/**' # Only run if files in the frontend folder change
  pull_request:
    branches: [ developer ]
    paths:
      - 'frontend-react/**'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build-and-test"
  build-and-test:
    # The type of runner that the job will run on (a virtual machine hosted by GitHub)
    runs-on: ubuntu-latest

    # Since the React app is in a subfolder, we set the default working directory for all `run` steps
    defaults:
      run:
        working-directory: ./frontend-react

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # 1. Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Sets up Node.js environment for the runner
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use a recent Long-Term Support (LTS) version of Node.js
          cache: 'npm' # Enable caching for npm to speed up dependency installation
          cache-dependency-path: frontend-react/package-lock.json

      # 3. Installs all the project dependencies using npm
      - name: Install dependencies
        run: npm install

      # 4. Runs the build script (`vite build`) to create a production-ready version of the app
      - name: Build project
        run: npm run build

      # 5. (Optional but Recommended) Runs tests. You need a "test" script in your package.json for this.
      # - name: Run tests
      #   run: npm test